# SSH user-certificate authentication.
# Deployed by ca-ssh/40-deploy.sh - do not edit by hand on individual hosts;
# change the template in the CA repo and re-deploy.
#
# Trust model:
#   user-ca       signs routine operator certificates (principals group:* / login)
#   breakglass-ca signs emergency certificates only (principal "breakglass")

# --- global: routine CA + revocation + principals location ----------------
TrustedUserCAKeys /etc/ssh/ca/trusted-user-ca.pub
RevokedKeys /etc/ssh/ca/user-ca.krl

# Per-account allow lists rendered from inventory.
AuthorizedPrincipalsFile /etc/ssh/ca/principals/%u

# Disable the legacy scattered-key model. "none" means sshd will not even look
# at ~/.ssh/authorized_keys; certificates are the only accepted pubkey form.
AuthorizedKeysFile none

PubkeyAuthentication yes
PasswordAuthentication no
KbdInteractiveAuthentication no

# --- emergency account: separate trust domain, separate KRL ----------------
# First-match-wins: this block must stay ABOVE any broad "Match all" rules.
Match User breakglass
    TrustedUserCAKeys /etc/ssh/ca/breakglass-ca.pub
    RevokedKeys /etc/ssh/ca/breakglass-ca.krl
    AuthorizedPrincipalsFile /etc/ssh/ca/principals/%u
    AuthorizedKeysFile none
    # Hardening for the emergency channel.
    PermitTTY yes
    X11Forwarding no
    AllowAgentForwarding no
    AllowTcpForwarding no
    PermitTunnel no
    GatewayPorts no
